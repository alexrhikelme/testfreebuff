name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck e testes
    runs-on: ubuntu:24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.2"

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck (tsc)
        run: bunx tsc -b --noEmit

      - name: Testes unitários (Vitest)
        run: bun run test

      - name: Relatório de cobertura
        if: always()
        run: bun run test -- --coverage

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 7

      - name: Resumo do GitHub
        if: always()
        run: |
          echo "### Execução concluída" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow: `${{ github.workflow }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: `${{ github.ref_name }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: `${{ github.sha }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: `${{ job.status }}`" >> "$GITHUB_STEP_SUMMARY"
